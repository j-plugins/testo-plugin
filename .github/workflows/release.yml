# Publishes a release tagged by the Build workflow: builds both variants, attaches the ZIPs, uploads to the Marketplace.
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  # Called by the Build workflow once it has tagged a release; dispatched by hand to retry one.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        type: string
        required: true
      apis:
        description: Variants to publish, comma-separated (default phpApis)
        type: string
        required: false

jobs:

  # Build every variant and attach its ZIP to the release
  assets:
    name: Release Asset (${{ matrix.phpApi }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { phpApi: 252, buildDir: build }
          - { phpApi: 262, buildDir: build }
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true

      # Build plugin
      - name: Build plugin
        run: ./gradlew buildPlugin -PphpApi=${{ matrix.phpApi }}

      # Upload the plugin archive as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ inputs.tag }} ./${{ matrix.buildDir }}/distributions/*.zip --clobber

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          APIS: ${{ inputs.apis }}
        # One Gradle run per variant, in turn: a failed upload can be retried for the variants still missing.
        run: |
          for api in $(echo "${APIS:-$(sed -n 's/^phpApis *= *//p' gradle.properties)}" | tr ',' ' '); do
            ./gradlew publishPlugin -PphpApi="$api" -PphpApiSingle=true
          done
