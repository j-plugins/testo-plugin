# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.github.xepozz.testo
pluginName = Testo
pluginRepositoryUrl = https://github.com/j-plugins/testo-plugin
# SemVer format -> https://semver.org
pluginVersion = 2026.3.1

# PHP moved its coverage classes from com.jetbrains.php.phpunit.coverage to com.intellij.php.coverage in 2026.2, so a
# single artifact cannot cover both. Everything below is therefore declared twice, suffixed by the target API, and
# `phpApi` picks the variant: `./gradlew buildPlugin -PphpApi=252` for 2025.2-2026.1, the default for 2026.2+.
# Only src/php<phpApi>/kotlin differs between the two — it holds typealiases to whichever package is current.
# `publishPlugin` releases every API listed in `phpApis`, re-entering Gradle once per variant.
phpApi = 262
phpApis = 252,262

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild.252 = 252
pluginUntilBuild.252 = 261.*
pluginSinceBuild.262 = 262
pluginUntilBuild.262 =

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
# IU (IDEA Ultimate) pins each PHP-family plugin to a marketplace build matching the target platform.
platformType = IU
platformVersion.252 = 2025.2
platformVersion.262 = 262.9437.65

# The sandbox IDE `runPhpStorm` launches. Named by release rather than by the build numbers above: those are IU's, and
# PhpStorm publishes no download under them — asking for 262.9437.65 fails to resolve a URL at all.
phpStormVersion.252 = 2025.2
phpStormVersion.262 = 2026.2

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.jetbrains.php:203.4449.22, org.intellij.scala:2023.3.27@EAP
# com.jetbrains.hackathon.indices.viewer has no 262-compatible build; it is a sandbox-only convenience either way.
# Keep com.github.xepozz.ide.introspector at 2026.1.0 or later: 2026.0.2 bundled kotlin-compiler-embeddable-2.1.20.jar,
# which shades a stale messages/JavaPsiBundle.properties onto the test classpath and fails every platform test.
platformPlugins.252=com.jetbrains.php:252.23892.458,com.jetbrains.hackathon.indices.viewer:1.31,org.jetbrains.plugins.phpstorm-remote-interpreter:252.23892.360,com.jetbrains.php.codeception:252.23892.458,com.jetbrains.php.behat:252.23892.360,gherkin:252.23892.201,com.github.xepozz.ide.introspector:2026.1.0
platformPlugins.262=com.jetbrains.php:262.9437.22,org.jetbrains.plugins.phpstorm-remote-interpreter:262.9437.22,com.jetbrains.php.codeception:262.9437.22,com.jetbrains.php.behat:262.8665.176,gherkin:262.8665.173,com.github.xepozz.ide.introspector:2026.1.0
# Example: platformBundledPlugins = com.intellij.java
platformBundledPlugins =
# Example: platformBundledModules = intellij.spellchecker
# 2026.2 split smRunner/testRunner out of the monolith, so they have to be requested explicitly there.
platformBundledModules.252 = intellij.platform.coverage,intellij.spellchecker
platformBundledModules.262 = intellij.platform.coverage,intellij.spellchecker,intellij.platform.smRunner,intellij.platform.testRunner

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.5.0

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
